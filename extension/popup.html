<!doctype html>
<html><head><meta charset="utf-8"><title>Hide My Text</title>
<link rel="icon" href="images/hide-my-text-32.png">
<style>
:root{--bg:#f4f5f8;--card:#fff;--text:#1b1d24;--muted:#6b7280;--border:#dfe2ea;--accent:#4f46e5;--accent-text:#fff;--danger:#d92d20;--chip:#eef0ff}
:root[data-theme=dark]{--bg:#14161c;--card:#1e212b;--text:#e8eaf0;--muted:#9aa1b2;--border:#323646;--accent:#818cf8;--accent-text:#0f1020;--danger:#f97066;--chip:#2a2e44}
*{box-sizing:border-box}
body{font:14px system-ui,sans-serif;width:360px;margin:0;padding:14px;background:var(--bg);color:var(--text)}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
header h1{font-size:16px;margin:0}
.card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:10px}
h3{margin:0 0 8px;font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
input,select{width:100%;margin:3px 0;padding:8px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text);font:inherit}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:-1px}
button{padding:7px 12px;border:1px solid var(--border);border-radius:6px;background:var(--card);color:var(--text);font:inherit;cursor:pointer}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);color:var(--accent-text);border-color:var(--accent);width:100%;margin-top:4px}
button.danger{color:var(--danger)}
button.link{border:0;background:none;color:var(--muted);padding:4px 0;text-decoration:underline;width:auto}
button.icon{padding:4px 8px}
.scope{display:flex;gap:14px;margin:6px 0}.scope label{display:flex;align-items:center;gap:4px;cursor:pointer}.scope input{width:auto;margin:0}
ul{padding:0;margin:0;list-style:none}
li{display:flex;align-items:center;gap:6px;padding:7px 0;border-bottom:1px solid var(--border)}li:last-child{border:0}
li .txt{flex:1;word-break:break-all;font-family:ui-monospace,monospace}
.chip{font-size:11px;background:var(--chip);color:var(--accent);padding:2px 7px;border-radius:99px;max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item{border-bottom:1px solid var(--border);padding:7px 0}.item:last-child{border:0}.item li{border:0;padding:0}
.name{font-weight:600}.sub{font-size:12px;color:var(--muted);font-family:ui-monospace,monospace;word-break:break-all}
.edit{margin-top:8px;padding:8px;border:1px dashed var(--border);border-radius:8px}
.edit .site{display:flex;align-items:center;justify-content:space-between;font-size:12px;padding:2px 0}
.edit .row{display:flex;gap:6px}.edit .row input{flex:1}.edit .row button{width:auto}
.edit .actions{display:flex;gap:6px;margin-top:6px}.edit .actions button{flex:1}
.empty{color:var(--muted);text-align:center;padding:6px 0}
.err{color:var(--danger);min-height:1em;margin:4px 0}.muted{color:var(--muted);font-size:12px}
.hidden{display:none!important}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:20px}
#modal .card{width:100%;margin:0}#modal .row{display:flex;gap:6px}#modal .row button{flex:1}
</style></head>
<body>
<header><h1>🔒 Hide My Text</h1><button id="theme" class="icon" title="Toggle dark mode">🌙</button></header>

<div id="auth" class="card hidden">
  <p id="authMsg" class="muted"></p>
  <input id="pw" type="password" placeholder="Master password" autocomplete="current-password">
  <input id="pw2" type="password" placeholder="Confirm master password" class="hidden" autocomplete="new-password">
  <button id="authBtn" class="primary"></button>
  <button id="forgot" class="link hidden">Forgot master password?</button>
</div>

<div id="main" class="hidden">
  <div class="card">
    <h3>Add text to hide</h3>
    <input id="newName" placeholder="Name (required for all sites)">
    <input id="newText" type="password" placeholder="Text to hide" autocomplete="off">
    <div class="scope">
      <label><input type="radio" name="scope" value="all" checked> All sites</label>
      <label><input type="radio" name="scope" value="some"> Specific sites</label>
    </div>
    <div id="sitesBox" class="hidden">
      <input id="newSites" placeholder="example.com, other.org">
      <button id="addCurrent">Use current site</button>
    </div>
    <select id="newMode"><option value="">Default action</option><option value="blur">Blur</option><option value="replace">Replace</option><option value="delete">Delete</option></select>
    <input id="newReplacement" placeholder="Replacement text" class="hidden">
    <button id="addText" class="primary">Add</button>
  </div>

  <div class="card">
    <h3>Hidden texts</h3>
    <ul id="items"></ul>
  </div>

  <div class="card">
    <h3>Default action</h3>
    <select id="mode"><option value="blur">Blur</option><option value="replace">Replace</option><option value="delete">Delete</option></select>
    <input id="replacement" placeholder="Replacement text">
  </div>
  <button id="lock" class="primary">Lock</button>
</div>
<div id="modal" class="hidden"><div class="card"><p id="modalMsg"></p><input id="modalInput" type="password" placeholder="Master password"><div class="row"><button id="modalCancel">Cancel</button><button id="modalOk" class="primary" style="margin:0">OK</button></div></div></div>
<p id="err" class="err"></p>
<script src="popup.js"></script>
</body></html>
