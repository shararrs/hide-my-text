<!doctype html>
<html><head><meta charset="utf-8"><title>Hide My Pass</title>
<style>
body{font:14px system-ui,sans-serif;width:340px;margin:12px}
h3{margin:12px 0 4px}input,select,textarea,button{width:100%;box-sizing:border-box;margin:3px 0;padding:5px}
ul{padding:0;margin:4px 0;list-style:none}li{display:flex;justify-content:space-between;gap:6px;margin:2px 0;word-break:break-all}
li button{width:auto}.err{color:#b00020}.hidden{display:none}
</style></head>
<body>
<div id="auth" class="hidden">
  <p id="authMsg"></p>
  <input id="pw" type="password" placeholder="Master password" autocomplete="current-password">
  <input id="pw2" type="password" placeholder="Confirm master password" class="hidden" autocomplete="new-password">
  <button id="authBtn"></button>
</div>
<div id="main" class="hidden">
  <h3>Texts to hide</h3>
  <input id="newText" placeholder="Text to hide"><button id="addText">Add</button>
  <ul id="items"></ul>
  <h3>Websites (hide only on these)</h3>
  <input id="newSite" placeholder="example.com"><button id="addSite">Add</button>
  <button id="addCurrent">Add current site</button>
  <ul id="sites"></ul>
  <h3>Action</h3>
  <select id="mode"><option value="blur">Blur</option><option value="replace">Replace</option><option value="delete">Delete</option></select>
  <input id="replacement" placeholder="Replacement text">
  <button id="lock">Lock</button>
</div>
<p id="err" class="err"></p>
<script src="popup.js"></script>
</body></html>
